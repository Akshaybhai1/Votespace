spring.application.name=VoteSpace
server.port=8080

# ---------- JSP views ----------
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ---------- MySQL (database is created automatically if missing) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/voterinfo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- Image upload ----------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Folder where photos are saved (relative to where the app is started)
app.upload-dir=uploads

# ---------- E-mail (Gmail example) ----------
# Create a Google "App password", then set MAIL_USERNAME / MAIL_PASSWORD as
# environment variables (never commit real passwords).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=mr.akshaybaghel@gmail.com
spring.mail.password=atfj adti xfmc nbbu
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
app.mail.from=${MAIL_USERNAME:no-reply@votespace.local}
# Used for the login link inside e-mails
app.base-url=http://localhost:8080
